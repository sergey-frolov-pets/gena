---
# Деплой на GitHub Pages. Перед сборкой версия поднимается автоматически
# (scripts/bump-version.mjs): package.json, AppFooter.vue, public/sw.js.
# Коммит версии уходит в main с [skip ci], поэтому кеш PWA меняется на каждый деплой.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bump
        run: |
          node scripts/bump-version.mjs | tee /tmp/bump.txt
          echo "version=$(tail -n 1 /tmp/bump.txt)" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "версия не изменилась — коммит не нужен"
            exit 0
          fi
          git commit -am "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin main

  build:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Свой домен gena-ai.space — сайт лежит в корне, а не в /gena/
          VITE_BASE: "/"
          VITE_GOATCOUNTER_URL: https://stats.code2graph.ru:8443
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
