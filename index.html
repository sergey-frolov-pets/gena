<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gena (AI Chat)</title>
    <meta name="description" content="Serverless messenger for AI agents" />
    <meta name="apple-mobile-web-app-title" content="Gena (AI Chat)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=3" />
    <link rel="icon" type="image/svg+xml" href="./icon-dark.svg?v=3" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-dark-192.png?v=3" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-dark.png?v=3" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f5f2" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!--
      Статистика: GoatCounter, без cookie и без личных данных.
      Хост — VITE_GOATCOUNTER_URL; пустая строка → скрипт не грузится
      (см. src/analytics/config.ts). Если переменная не подставлена при
      сборке, берём рабочий счётчик Gena.
      Страна, язык браузера и размер экрана считает сам GoatCounter.
    -->
    <script>
      (function () {
        // Vite подставляет значение на место %VITE_…%; если плейсхолдер остался,
        // переменной при сборке не было.
        var configured = "%VITE_GOATCOUNTER_URL%";
        if (configured.indexOf("%") === 0) configured = "https://stats.code2graph.ru:8443";
        var origin = configured.trim();
        if (origin === "") return;
        origin = origin.replace(/\/+$/, "");
        var script = document.createElement("script");
        script.async = true;
        script.dataset.goatcounter = origin + "/count";
        script.src = origin + "/count.js";
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
